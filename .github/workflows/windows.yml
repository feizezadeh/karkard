name: Windows Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release
        working-directory: rust-version
        run: cargo build --release --package karkard-app

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: karkard-windows-x64
          path: rust-version/target/release/karkard-app.exe

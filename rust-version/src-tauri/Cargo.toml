[package]
name = "karkard-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "karkard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
karkard-core = { path = "../crates/karkard-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.17.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
